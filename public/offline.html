<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1a2b" />
    <title>Offline · Amorphix</title>
    <style>
      :root { --paper: #f4f7fb; --ink: #0e1a2b; --soft: #5b6b80; --accent: #2f6fed; }
      @media (prefers-color-scheme: dark) { :root { --paper: #0d1117; --ink: #e6edf3; --soft: #8b98a8; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      p.kicker { font: 11px/1 ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); margin-top: 20px; }
      h1 { font: 400 36px/1.1 Georgia, serif; margin: 8px 0 0; }
      p { color: var(--soft); max-width: 22rem; }
      button { margin-top: 16px; border: 0; border-radius: 999px; padding: 12px 24px; background: var(--accent); color: #fff; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Amorphix" />
      <p class="kicker">&gt; no connection</p>
      <h1>You're offline</h1>
      <p>Amorphix needs the internet to read your taste and draw your design. Your projects are safe; try again when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
